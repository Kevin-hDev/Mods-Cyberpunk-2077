# V's execution lines, read by Audioware as the game starts. Written by fabrique/manifest.py from the table of
# fabrique/lines.py, which makes the sounds and r6/scripts/ExecutionLines/LinesTable.reds too: change that table, never
# this file. Each line is named after the mod: Audioware wants a line's name unique among the game's and every mod's.
# It picks a line's recording by the game's voice language, with no fallback, so each line is declared for all 19
# languages of the game, the same recording in each. Each line holds the recording of one voice, which its name says:
# execution_lines_f_ from female/, execution_lines_m_ from male/. The scripts pick the voice; no line is declared with
# fem and male, which Audioware would pick by a gender it keeps from an earlier load.
