# V's voice lines of Apex Grapple, the same recordings as Cyber Grapple's (Kevin, 18 and 19 November 2026), read by
# Audioware as the game starts. Each line is named after the mod: Audioware wants a line's name unique among the
# game's and every mod's. It picks a line's recording by the game's voice language, with no fallback, so each line is
# declared for all 19 languages of the game, the same recording in each. One line per recording, its name holding its
# voice (_f_, _m_), declared without a gender: the scripts ask it for that V only
# (r6/scripts/ApexGrapple/VoiceLines.reds), by the menu's choice else V's own voice (VoiceGender.reds). No line is
# declared in both voices: Audioware's own gender of V did not follow a female V loaded after a male one (Kevin, 19
# November 2026). fabrique/test_voices.py checks these lines against the files and the scripts.
