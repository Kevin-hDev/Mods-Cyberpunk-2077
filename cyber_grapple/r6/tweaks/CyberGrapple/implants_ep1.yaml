# The six ripperdocs of the 27 that exist only with Phantom Liberty (read in the game's data: in tweakdb_ep1.bin, not
# in tweakdb.bin). TweakXL reads this file only when the expansion is installed, by the $dlc key at its root (TweakXL
# 1.9.0 and later); without it, an entry on a ripperdoc that does not exist would be refused with an error in
# TweakXL's log. The sales they add are in implants.yaml.
