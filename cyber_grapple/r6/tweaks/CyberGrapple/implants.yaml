# The implant's records (docs/cyber-grapple/conception.md): the grapple fires only with one of them worn.
# Names final since 17 November 2026 (D27) and never renamed again: they are written into the players' saves.

# One line of the implant's card each: a package that does nothing, with a text. The game lays a record's packages
# on V when the implant is fitted and, for an item of the launcher's type taken off the active arm slot, the only
# slot the game has, does not take them back (equipmentSystem.script:2109-2114, UnequipItem): none of ours may carry
# a stat.
CyberGrapple.LineTravel:
  $type: GameplayLogicPackage
  UIData:
    $type: GameplayLogicPackageUIData
    localizedDescription: LocKey#CyberGrapple-Card-Travel

# One line a distance: the card tells how far the pull reaches, which grows with the tier (the table of pull
# ranges in Tiers.reds, which test_source.py reads to check these lines and each tier's).
