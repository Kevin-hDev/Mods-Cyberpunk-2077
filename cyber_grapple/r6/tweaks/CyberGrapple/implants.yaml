# Everything the eleven tiers share. Copied from the game's launcher as it stands before any ammunition, stats shard
# or damage line is added to it (arms_cyberware_advanced.tweak, AdvancedProjectileLauncherBase): the arm, the item
# type the Glamdoc reads, the arm cyberware slot and the capacity cost of 8 come with it; the launcher's family does
# not (below). Of the explosive round only the piece itself is put back below, for the arm's look. The icon is a
# prop's of the game, a broken cybernetic arm, picked by Kevin from the sheets of the game's icons and kept after a
# look in game (16 November 2026): with the launcher's icon it could not be told from the game's launchers in a
# ripperdoc's list.
Items.CyberGrappleBase:
  $base: Items.AdvancedProjectileLauncherBase
  # A family of its own: the game keeps one implant a family in the arm slots (equipmentSystem.script:765-771), and
  # with the launcher's the implant and the game's launcher pushed each other out of a second arm slot (tried in game,
  # 18 November 2026). Kevin, the same night: both worn together, each working. With the game's one arm slot the
  # ripperdoc still fits it in that slot, emptied first (:764); a vendor's "new" mark (vendor.script:646-706,
  # :1092-1107) and the ripperdoc's token-upgrade hint (ripperdocTokenManager.script:25-29) go by family, so ours are
  # told apart from the launcher's there. The gadget slot reads this name too, and is told the launcher's for our
  # implant (SlotCharges.reds). Written bare, as iconPath below: TweakXL knows both as names (its ExtraFlats.dat).
  cyberwareType: CyberGrapple
  displayName: LocKey#CyberGrapple-Card-Name
  localizedDescription: LocKey#CyberGrapple-Card-Description
  iconPath: undefined_int_toys_002__broken_arm_None_
  tags:
    - !append-once CyberGrapple
  # The game's own round, as its launcher presets it. Without a round the arm lent for a shot never appeared in V's
  # hand (tried in game, 16 November 2026, 40 shots: the item was set in the slot and never seen there), and the
  # round is the one piece with a look that the bare base lacks. It never leaves: the gadget key starts no launcher's
  # shot for the implant on it (GadgetQuickslot.reds, CheckItemCategoryInQuickWheel), the launcher's own question
  # answers no when it is about the implant (LauncherCharges.reds, ProjectileLauncherHasCharge), and the shot itself is
  # stopped (NoProjectile.reds).
  slotPartListPreset:
    - !append
      slot: AttachmentSlots.ProjectileLauncherRound
      itemPartPreset: Items.ExplosiveDamageRound

# Tier 1 to 11, Common to LegendaryPlusPlus, each upgraded into the next. The tier is read from the worn implant's
# own tag (Implant.reds). A card says what its tier unlocks, and the level of V the next full tier asks for: those
# levels are the game's own sale rules (LootPrereqs.<quality>CWLevelAvailabilityAtVendor), which Upgrade.reds reads.
Items.CyberGrappleCommon:
  $base: Items.CyberGrappleBase
  quality: Quality.Common
  nextUpgradeItem: Items.CyberGrappleCommonPlus
  tags:
    - !append-once CyberGrappleTier1
  OnEquip:
    - CyberGrapple.LineTravel
    - CyberGrapple.LineNext10

