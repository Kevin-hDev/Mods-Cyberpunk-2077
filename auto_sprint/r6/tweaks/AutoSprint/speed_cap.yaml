# Auto Sprint: lets the sprint and walk speed settings go past the game's limits. Read when the game starts, before any
# save loads: changing a limit with the CET console during play, then reloading the save, crashed the game.

# The player's MaxSpeed stat is capped at 15: a sprint at x2 or x3 read the same 15 (log of 21 October 2026).
BaseStats.MaxSpeed:
  max: 50.0

# The engine then holds V to player.locomotion.maxGroundSpeed (15 on the ground, 18 in the air). SpeedLimit.reds lifts
# that hold, as the game does for a dash, and V is held to these extended limits instead: 30 in the game, which
# stopped a sprint at x5 at 30 m/s. 50 leaves room for 5 times a sprint of about 7.9 m/s. Other mods of ours that need
# these values carry the same numbers: the install tool refuses two different values.
player.locomotion.extendedMaxGroundSpeed:
  $type: Float
  $value: 50.0
player.locomotion.extendedMaxAirXYSpeed:
  $type: Float
  $value: 50.0
